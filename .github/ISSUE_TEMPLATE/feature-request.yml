name: Feature request
description: Propose a feature or design improvement.
title: '[Feature]: '
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe the task you need to accomplish and who benefits.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the desired outcome and which module it belongs in, if known.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples or related issues. Do not include credentials or private data.
