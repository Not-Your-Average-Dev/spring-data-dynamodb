name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Java 17 / Boot ${{ matrix.boot }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        boot: [baseline, latest-minor]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify reactor
        shell: bash
        env:
          BOOT_LINE: ${{ matrix.boot }}
        run: |
          args=()
          if [[ "$BOOT_LINE" == "latest-minor" ]]; then
            version=$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          version = ET.parse('pom.xml').findtext('m:properties/m:spring-boot.compatibility.version', namespaces=ns)
          if not version:
              raise SystemExit('Missing spring-boot.compatibility.version in parent POM')
          print(version)
          PY
            )
            args+=("-Dspring-boot.version=$version")
          fi
          ./mvnw --batch-mode --no-transfer-progress "${args[@]}" verify
